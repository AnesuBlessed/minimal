<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Outer Glass Border Stroke -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#71717a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Inner Core Shadow / Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Monogram Shading Gradients -->
    <!-- 1. Pure Frosted White (Primary Light Source: Top Left) -->
    <linearGradient id="facetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <!-- 2. Platinum / High Silver -->
    <linearGradient id="facetPlatinum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- 3. Metallic Silver / Mid Gray -->
    <linearGradient id="facetSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <!-- 4. Deep Titanium / Charcoal Accent -->
    <linearGradient id="facetTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- 5. Obsidian Edge Shadow -->
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile (512x512 Canvas, Tile 464x464) -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104"
        fill="url(#bgGrad)" stroke="url(#rimStroke)" stroke-width="2.5"/>

  <!-- Radial Light Diffuser -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Inner Top Rim Highlight Reflection -->
  <path d="M 128 26 C 72 26 26 72 26 128"
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <!-- ======================================================== -->
  <!--  THE MINIMAL MONOGRAM "M" — RAZOR PRECISION POLYGON CUT  -->
  <!-- ======================================================== -->
  <g id="minimal-monogram">
    <!-- Left Pillar (Pure White Angular Column) -->
    <!-- Points: (108,372) -> (108,172) -> (156,124) -> (176,124) -> (176,372) -->
    <polygon points="108,372 108,172 156,124 176,124 176,372 108,372"
             fill="url(#facetWhite)"/>

    <!-- Left Pillar Inner Bevel (Depth Step) -->
    <polygon points="176,124 192,140 192,372 176,372"
             fill="url(#facetTitanium)"/>

    <!-- Left Descending Chevron Blade (45-degree angle to apex) -->
    <!-- From (176,124) down to (256,280) and back to (256,356) -->
    <polygon points="176,124 256,280 256,356 176,200"
             fill="url(#facetPlatinum)"/>

    <!-- Left Chevron Underside Shadow -->
    <polygon points="176,200 256,356 256,372 176,216"
             fill="url(#facetDark)"/>

    <!-- Right Descending Chevron Blade (Symmetric 45-degree angle to apex) -->
    <polygon points="336,124 256,280 256,356 336,200"
             fill="url(#facetSilver)"/>

    <!-- Right Chevron Underside Shadow -->
    <polygon points="336,200 256,356 256,372 336,216"
             fill="url(#facetDark)"/>

    <!-- Right Pillar Inner Bevel (Depth Step) -->
    <polygon points="336,124 320,140 320,372 336,372"
             fill="url(#facetDark)"/>

    <!-- Right Pillar (Metallic Titanium Column) -->
    <!-- Points: (404,372) -> (404,172) -> (356,124) -> (336,124) -> (336,372) -->
    <polygon points="404,372 404,172 356,124 336,124 336,372 404,372"
             fill="url(#facetSilver)"/>

    <!-- Right Outer Rim Chamfer -->
    <polygon points="404,172 356,124 372,124 404,156"
             fill="#ffffff" opacity="0.3"/>

    <!-- Center Floating Apex Shard (Razor Prism Core) -->
    <polygon points="256,160 286,220 256,260 226,220"
             fill="url(#facetWhite)"/>

    <!-- Center Shard Right Half (Facet Shading) -->
    <polygon points="256,160 286,220 256,260"
             fill="url(#facetTitanium)"/>

    <!-- Horizontal Minimalist Balance Bar (Subtle Pedestal) -->
    <rect x="226" y="392" width="60" height="4" rx="2"
          fill="#71717a" opacity="0.6"/>
  </g>
</svg>
