# =============================================================================
#  MINIMAL — HYPRLOCK (ADAPTED SILENT / MINIMAL AESTHETIC)
# =============================================================================
$font = JetBrainsMono Nerd Font
$accent = rgb(bdbed0)
$base = rgb(171c1e)
$surface = rgb(343b3e)
$text = rgb(eef0f0)
$critical = rgb(e06c75)

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = $MINIMAL_CACHE/lock.png
    color = $base
    blur_passes = 0
    blur_size = 4
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# TIME (Large Centered Clock)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 76
    font_family = $font Bold
    position = 0, 240
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d, %Y")"
    color = $accent
    font_size = 17
    font_family = $font Medium
    position = 0, 175
    halign = center
    valign = center
}

# CIRCULAR USER AVATAR
image {
    monitor =
    path = $MINIMAL_CACHE/avatar
    size = 120
    rounding = -1
    border_size = 1
    border_color = $accent
    reload_time = -1
    position = 0, 40
    halign = center
    valign = center
}

# USERNAME
label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = $font Bold
    position = 0, -42
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    rounding = 6
    placeholder_text = Password
    hide_input = false
    position = 0, -96
    halign = center
    valign = center
    check_color = $accent
    fail_color = $critical
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

# KEYBOARD LAYOUT (Bottom Left)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $accent
    font_size = 13
    font_family = $font
    position = 30, 25
    halign = left
    valign = bottom
}

# BATTERY STATUS (Bottom Right)
label {
    monitor =
    text = cmd[update:30000] "$MINIMAL_ROOT/scripts/battery-status.sh"
    color = $accent
    font_size = 13
    font_family = $font
    position = -30, 25
    halign = right
    valign = bottom
}
