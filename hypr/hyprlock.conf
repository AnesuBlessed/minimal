# Lock background is pre-blurred once on wallpaper change, never by the GPU.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = $MINIMAL_CACHE/lock.png
    color = rgb(181822)
    blur_passes = 0
}

shape {
    monitor =
    size = 360, 270
    color = rgba(181822dd)
    rounding = 10
    border_size = 1
    border_color = rgba(b8c47055)
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(f4f4f5)
    font_size = 46
    font_family = $font
    position = 0, 68
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a, %d %b"
    color = rgb(c9c9d2)
    font_size = 12
    font_family = $font
    position = 0, 14
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    inner_color = rgba(242430ee)
    outer_color = rgba(b8c470aa)
    check_color = rgb(b8c470)
    fail_color = rgb(e06c75)
    font_color = rgb(f4f4f5)
    font_family = $font
    placeholder_text = Enter password
    fail_text = Try again
    fade_on_empty = false
    rounding = 8
    dots_size = 0.22
    dots_spacing = 0.25
    position = 0, -46
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] "$MINIMAL_ROOT/scripts/battery-status.sh"
    color = rgb(c9c9d2)
    font_size = 11
    font_family = $font
    position = 0, -99
    halign = center
    valign = center
}
