# =============================================================================
#  MINIMAL — HYPRLOCK (OBSIDIAN GLASS AESTHETIC)
# =============================================================================
$font = JetBrainsMono Nerd Font
$base = rgb(0f1a2a)
$surface = rgb(182234)
$border = rgb(506182)
$text = rgb(cce1ff)
$muted = rgb(7a92c2)
$accent = rgb(ca9ee6)
$critical = rgb(e06c75)

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 2
    blur_size = 6
    contrast = 0.9
    brightness = 0.8
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $accent
    font_size = 80
    font_family = $font Bold
    position = 0, 120
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $muted
    font_size = 16
    font_family = $font Medium
    position = 0, 45
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $border
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="#7a92c2">Input Password...</span>
    hide_input = false
    position = 0, -45
    halign = center
    valign = center
    check_color = $accent
    fail_color = $critical
    fail_text = <i>$FAIL</i>
}

# USERNAME
label {
    monitor =
    text = $USER
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# BATTERY STATUS (Bottom Right)
label {
    monitor =
    text = cmd[update:30000] sh -c '"$MINIMAL_ROOT/scripts/battery-status.sh"'
    color = $muted
    font_size = 12
    font_family = $font
    position = -30, 25
    halign = right
    valign = bottom
}
