# =============================================================================
#  MINIMAL — HYPRLOCK (ADAPTED SILENT / MINIMAL AESTHETIC)
# =============================================================================
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

background {
    monitor =
    path = $MINIMAL_CACHE/lock.png
    color = rgba(18, 18, 24, 1.0)
    blur_passes = 2
    blur_size = 4
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# TIME (Large Centered Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(244, 244, 245, 0.95)
    font_size = 76
    font_family = $font Bold
    position = 0, 240
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(188, 184, 239, 0.85)
    font_size = 17
    font_family = $font Medium
    position = 0, 175
    halign = center
    valign = center
}

# CIRCULAR USER AVATAR
image {
    monitor =
    path = ~/.face.icon
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(188, 184, 239, 0.75)
    reload_time = -1
    position = 0, 40
    halign = center
    valign = center
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(244, 244, 245, 0.95)
    font_size = 16
    font_family = $font Bold
    position = 0, -42
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 250, 42
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(188, 184, 239, 0.6)
    inner_color = rgba(18, 18, 24, 0.65)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 12
    placeholder_text = <i><span foreground="##ffffff88">Password...</span></i>
    hide_input = false
    position = 0, -96
    halign = center
    valign = center
    check_color = rgba(188, 184, 239, 0.9)
    fail_color = rgb(224, 108, 117)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
}

# KEYBOARD LAYOUT (Bottom Left)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(188, 184, 239, 0.75)
    font_size = 13
    font_family = $font
    position = 30, 25
    halign = left
    valign = bottom
}

# BATTERY STATUS (Bottom Right)
label {
    monitor =
    text = cmd[update:10000] "$MINIMAL_ROOT/scripts/battery-status.sh"
    color = rgba(188, 184, 239, 0.75)
    font_size = 13
    font_family = $font
    position = -30, 25
    halign = right
    valign = bottom
}
