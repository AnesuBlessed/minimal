# =============================================================================
#  MINIMAL — HYPRIDLE (IDLE MANAGEMENT)
# =============================================================================
general {
    # ~/.config/hypr is a symlink into the checkout, so hypr/.. resolves to it
    # even when MINIMAL_ROOT isn't in this process's environment.
    lock_cmd = sh -c '"${MINIMAL_ROOT:-${XDG_CONFIG_HOME:-$HOME/.config}/hypr/..}/scripts/lock.sh"'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Lock after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
