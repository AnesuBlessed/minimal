# Minimal launcher: bottom-centered dark card with a subtle selection pill
[main]
font=JetBrainsMono Nerd Font:size=11
use-bold=yes
prompt=""
placeholder="Search apps"
# Center a small decorative handle above the search field (56-column layout).
message="                          ━━━━"
icon-theme=Tela-circle-dracula
icons-enabled=yes
show-actions=yes
terminal=foot -e
fields=filename,name,generic,comment,categories,keywords
match-mode=fzf

# Layout Geometry
anchor=bottom
y-margin=0
dpi-aware=no
width=56
lines=8
tabs=4
horizontal-pad=10
vertical-pad=10
inner-pad=6
image-size-ratio=0.5
line-height=24
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Format: RRGGBBAA
# Background: Hydra dark base card
background=171c1ecc
text=eef0f0ff
message=adb4b699
prompt=d4b9c7ff
placeholder=adb4b6ff
input=eef0f0ff
match=d4b9c7ff

# Subtle selection with readable light text
selection=343b3eee
selection-text=eef0f0ff
selection-match=d4b9c7ff

# Subtle Surface Border
border=d4b9c74c

[border]
width=1
radius=12
selection-radius=6

[dmenu]
mode=text
exit-immediately-if-empty=no
