# =============================================================================
#  MINIMAL FUZZEL — TRANSLUCENT APP LAUNCHER
# =============================================================================
#  Matches Inspiration Images 1 & 6:
#  - Compact proportions (width = 32, lines = 7)
#  - Rounded glass window (radius = 14) with subtle sage-olive accent border
#  - Rounded selection pill (selection-radius = 8)
#  - Clean, crisp typography (size = 9.5, line-height = 22)
#  - Full icon coverage via Tela-circle-dracula with hicolor/breeze fallbacks
# =============================================================================

[main]
font=JetBrainsMono Nerd Font:size=9.5
prompt="   "
placeholder="Search apps..."
icon-theme=hicolor
icons-enabled=yes
show-actions=yes
terminal=sh -c 'if command -v footclient >/dev/null 2>&1; then footclient "$@"; elif command -v foot >/dev/null 2>&1; then foot "$@"; else kitty "$@"; fi' -- {cmd}
fields=filename,name,generic,comment,categories,keywords

# Layout Geometry
width=32
lines=7
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=8
image-size-ratio=0.5
line-height=22
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Format: RRGGBBAA
# Background: Translucent dark glass
background=72685Ff0
text=ffffffff
prompt=7D634Bff
placeholder=71717acc
input=ffffffff
match=7D634Bff

# Selected Item Pill
selection=C29C7Aee
selection-text=ffffffff
selection-match=523C29ff

# Subtle Sage-Olive Accent Border
border=7D634B55

[border]
width=1
radius=14
selection-radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
