# Minimal launcher: larger centered panel, with a lower offset via launcher.sh.
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="   "
placeholder="Search apps..."
icon-theme=hicolor
icons-enabled=yes
show-actions=yes
terminal=sh -c 'footclient "$@" || foot "$@"' -- {cmd}
fields=filename,name,generic,comment,categories,keywords

# Layout Geometry
anchor=top
y-margin=266
dpi-aware=no
width=42
lines=8
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=8
image-size-ratio=0.5
line-height=30
letter-spacing=0
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Format: RRGGBBAA
# Background: Translucent dark glass
background=0e1f25f0
text=ffffffff
prompt=aed3e0ff
placeholder=71717acc
input=ffffffff
match=aed3e0ff

# Selected Item Pill
selection=234e5cff
selection-text=ffffffff
selection-match=aed3e0ff

# Subtle Sage-Olive Accent Border
border=aed3e055

[border]
width=1
radius=10
selection-radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
