name: Validate Minimal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies and parsers
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libjson-c-dev lua5.4 dbus-x11
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native helpers
        run: ./scripts/build.sh
      - name: Test native helpers and isolated carousel controls
        run: ./scripts/test.sh
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check
