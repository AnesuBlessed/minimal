# =============================================================================
#  MINIMAL FOOT TERMINAL CONFIGURATION
# =============================================================================
#  - Ultra-lean C-native Wayland terminal
#  - Built-in Sixel graphics support for anime HUD art in Fastfetch
#  - Shared server/client mode for faster startup
# =============================================================================

# Default terminal title
title=foot
locked-title=no

# Font Configuration
font=JetBrainsMono Nerd Font:size=6
font-bold=JetBrainsMono Nerd Font:size=6:weight=bold
font-italic=JetBrainsMono Nerd Font:size=6:slant=italic
letter-spacing=0
dpi-aware=yes

# Padding & Geometry
pad=10x10 center
initial-window-size-chars=100x28
initial-window-mode=windowed

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[colors-dark]
cursor=171c1e cdc5c1
# Soft dark glass background with 94% opacity
alpha=0.94
background=171c1e
foreground=eef0f0

# Selection
selection-foreground=eef0f0
selection-background=343b3e

# Standard Palette (Monochrome with Sage-Olive Accent)
regular0=1c1c22  # black
regular1=e06c75  # red
regular2=b8c470  # green (sage-olive)
regular3=e5c07b  # yellow
regular4=61afef  # blue
regular5=c678dd  # magenta
regular6=56b6c2  # cyan
regular7=abb2bf  # white

bright0=5c6370   # bright black
bright1=e06c75   # bright red
bright2=c5d17d   # bright green
bright3=e5c07b   # bright yellow
bright4=61afef   # bright blue
bright5=c678dd   # bright magenta
bright6=56b6c2   # bright cyan
bright7=ffffff   # bright white

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
show-urls-launch=Control+Shift+o
